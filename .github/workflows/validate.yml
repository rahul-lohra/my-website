name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['/', '/my-website/']
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      SITE_URL: https://rahul-lohra.github.io
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --dir backend build
